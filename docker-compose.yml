services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: font
      POSTGRES_PASSWORD: font
      POSTGRES_DB: font
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U font -d font"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      FONT_DATABASE_URL: postgresql+asyncpg://font:font@db:5432/font
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pg-data:
